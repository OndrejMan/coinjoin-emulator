# Source: shadowsocks-rust/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shadowsocks-rust
  labels:
    app.kubernetes.io/name: shadowsocks-rust
    app.kubernetes.io/instance: shadowsocks-rust
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shadowsocks-rust
      app.kubernetes.io/instance: shadowsocks-rust
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shadowsocks-rust
        app.kubernetes.io/instance: shadowsocks-rust
    spec:
      securityContext:
        {}
      volumes:
      - name: config
        configMap:
          name: shadowsocks-rust
      - name: plugins
        emptyDir: {}
      containers:
      - name: shadowsocks-rust
        securityContext:
          {
            allowPrivilegeEscalation: false,
            runAsNonRoot: true,
            capabilities: {
              drop: ["ALL"],
            },
            seccompProfile: {
              type: "RuntimeDefault"
            },
          }
        image: "dufkan/proxy:latest"
        imagePullPolicy: Always
        volumeMounts:
        - name: config
          mountPath: /etc/shadowsocks-rust
          readOnly: true
        - name: plugins
          mountPath: /usr/local/bin
        ports:
        - name: ss-8388
          containerPort: 8388
          protocol: TCP
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 20m
            memory: 32Mi
