kind: ConfigMap
apiVersion: v1
metadata:
  name: shadowsocks-rust
  labels:
    app.kubernetes.io/name: shadowsocks-rust
    app.kubernetes.io/instance: shadowsocks-rust
data:
  config.json: |
    {
      "servers":
        [
          {
            "fast_open": true,
            "method": "aes-256-gcm",
            "mode": "tcp_and_udp",
            "password": "i4W@JosK593pd*",
            "server": "::",
            "server_port": 8388,
            "service_port": 80
          }
        ]
    }
