name: Build and Push joinmarket-client-server to GHCR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "containers/joinmarket-client-server/**"
      - "vendor/joinmarket-clientserver"
      - ".gitmodules"
      - ".github/workflows/joinmarket-client-server.yaml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set lowercase repository owner
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract joinmarket-base metadata
        id: base-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_OWNER }}/joinmarket-base
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push the joinmarket-base image
        id: base-build
        uses: docker/build-push-action@v6
        with:
          context: ./vendor/joinmarket-clientserver
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.base-meta.outputs.tags }}
          labels: ${{ steps.base-meta.outputs.labels }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_OWNER }}/joinmarket-client-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./containers/joinmarket-client-server
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            JOINMARKET_BASE_IMAGE=ghcr.io/${{ env.REPO_OWNER }}/joinmarket-base@${{ steps.base-build.outputs.digest }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
