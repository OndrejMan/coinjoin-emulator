# Incremental typing gate for this branch.
#
# The other branch (clean-history) runs a strict configuration over a fully
# typed tree. Here the code inherited from the fork is untyped, so the gate
# starts lenient: it only reports errors mypy can find without annotations.
# Tighten module by module by adding stricter per-module sections below.
[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = silent
show_error_codes = True

# manager.py (the entrypoint script) and manager/ (the package) share a name;
# the script is checked through the package-relative path instead.
exclude = (?x)(^manager\.py$)
