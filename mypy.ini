# Strict typing gate, tightened module by module.
#
# The [mypy] block is the configuration the other branch (clean-history) runs
# over a fully typed tree. Every module inherited from the fork that is not
# annotated yet is opted out at the bottom of this file: typing a module means
# deleting its section, so the opt-out list is the remaining work.
[mypy]
mypy_path = stubs

# Your current good setting
check_untyped_defs = True
disallow_any_explicit = True

# Require type hints for all functions and methods
disallow_untyped_defs = True
disallow_incomplete_defs = True

# Prevent untyped functions from being called from typed ones
disallow_untyped_calls = True

# Disallow using variables with 'Any' type in generics (e.g., list[Any])
disallow_any_generics = True

# Warnings for code health and safety
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True

# Require Explicit Optionals (e.g., Optional[int] instead of just int = None)
no_implicit_optional = True
strict_optional = True

show_error_codes = True
strict_equality = True
warn_unreachable = True
disallow_subclassing_any = True
implicit_reexport = False
disallow_untyped_decorators = True

python_version = 3.11
pretty = True
show_column_numbers = True
show_error_context = True
color_output = True
enable_error_code = ignore-without-code, redundant-expr, truthy-bool
# manager.py (the entrypoint script) shares its name with the manager package.
exclude = (?x)(^manager\.py$)

# Third-party packages that ship no type information and have no local stub.
[mypy-podman.*]
ignore_missing_imports = True

[mypy-bip_utils.*]
ignore_missing_imports = True

[mypy-yaml]
ignore_missing_imports = True

[mypy-httpx]
ignore_missing_imports = True

[mypy-backoff]
ignore_missing_imports = True

